<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日本史 暗記カード</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;-webkit-text-size-adjust:100%;color:#172033;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
header{background:#172033;color:#fff;border-radius:22px;padding:20px;margin-bottom:12px}
h1{margin:0;font-size:24px}.sub{font-size:12px;opacity:.75;margin-top:4px}
.stats{display:flex;gap:7px;margin-top:14px}.stat{background:#26324b;padding:8px 11px;border-radius:11px;font-size:12px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
button{border:0;-webkit-appearance:none;appearance:none;touch-action:manipulation;border-radius:13px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
.menu button{background:#fff;color:#26324b}.menu button.active{background:#536dfe;color:#fff}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 5px 20px #17203312}
.top{display:flex;justify-content:space-between;align-items:center;color:#68738a;font-size:12px}
.tag{background:#eef1f7;padding:6px 9px;border-radius:9px}
.progress{height:7px;background:#e5e8ef;border-radius:99px;margin:13px 0 20px;overflow:hidden}.bar{height:100%;background:#536dfe;width:0}
.question{font-size:22px;font-weight:800;line-height:1.55;min-height:130px;display:flex;align-items:center}
.tap{width:100%;background:#536dfe;color:white;font-size:16px;padding:16px;margin-top:10px}
.answer{display:none;margin-top:14px;background:#f2f4f8;border-radius:16px;padding:18px;text-align:center}
.answer .ans{font-size:25px;font-weight:850;margin:8px 0}
.answer.show{display:block}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.remember{background:#e7f7ed;color:#17663a}.not{background:#fff0f0;color:#a32626}
.next{width:100%;margin-top:10px;background:#172033;color:#fff;display:none}.next.show{display:block}
.result{text-align:center}.score{font-size:44px;font-weight:900;margin:10px}
.help{font-size:12px;color:#717b90;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="app">
<header>
<h1>日本史 暗記カード</h1>
<div class="sub">タップで答えを見る → 「覚えた / まだ」を記録</div>
<div class="stats">
<div class="stat">残り <b id="remain">0</b></div>
<div class="stat">覚えた <b id="known">0</b></div>
<div class="stat">まだ <b id="weak">0</b></div>
</div>
</header>

<div class="menu">
<button id="allBtn" class="active" onclick="setFilter('all')">全部</button>
<button id="weakBtn" onclick="setFilter('weak')">覚えてない</button>
<button id="shuffleBtn" onclick="shuffleNow()">🔀 シャッフル</button>
<button onclick="resetMemory()">記録をリセット</button>
</div>

<div id="quiz" class="card">
<div class="top"><span id="category" class="tag"></span><span id="counter"></span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="question" class="question"></div>
<button class="tap" id="tapBtn" onclick="showAnswer()">タップして答えを見る</button>

<div id="answerBox" class="answer">
<div>答え</div>
<div id="answer" class="ans"></div>
<div class="rate">
<button class="remember" onclick="mark(true)">✓ 覚えた</button>
<button class="not" onclick="mark(false)">× まだ</button>
</div>
</div>
<button id="nextBtn" class="next" onclick="next()">次の問題 →</button>
</div>

<div id="result" class="card result" style="display:none">
<h2>終了！</h2>
<div class="score"><span id="finalKnown">0</span></div>
<div>このセットで「覚えた」にした問題</div>
<button class="tap" onclick="restart()">もう一度</button>
</div>
<div class="help">「覚えてない」を選ぶと、あとで「覚えてない」だけを出題できます。</div>
</div>

<script>
const questions = [
["院政","後三条天皇が1069年に出した荘園整理令は？","延久の荘園整理令"],
["院政","1086年に院政を始めた上皇は？","白河上皇"],
["院政","上皇が政治を行う仕組みは？","院政"],
["院政","上皇の側近として仕えた人々は？","院近臣"],
["武士","1156年の争乱は？","保元の乱"],
["武士","1159年の争乱は？","平治の乱"],
["平氏","1167年に太政大臣になった人物は？","平清盛"],
["平氏","平清盛が行った中国との貿易は？","日宋貿易"],
["源平","以仁王が出した倒幕の呼びかけは？","以仁王の令旨"],
["源平","源頼朝の本拠地は？","鎌倉"],
["源平","1185年、平氏が滅亡した戦いは？","壇ノ浦"],
["鎌倉","公文所の仕事は？","幕府の政務・財政を担当"],
["鎌倉","問注所の仕事は？","土地争いなどの裁判を担当"],
["鎌倉","1185年に置かれた役職は？","守護・地頭（守護＝軍事・警察、地頭＝土地管理・年貢徴収）"],
["鎌倉","守護の主な仕事は？","国内の軍事・警察、御家人の指揮"],
["鎌倉","地頭の主な仕事は？","荘園・公領の管理、年貢の徴収"],
["鎌倉","将軍が御家人に土地を保障することは？","将軍が御家人の土地を保障すること"],
["鎌倉","御家人が将軍に仕えることは？","御家人が将軍のために軍役などを行うこと"],
["鎌倉","土地を命がけで守る武士の考え方は？","自分の土地を命がけで守ること"],
["将軍を補佐し、幕府の政治を行う役職","将軍を補佐した役職は？","将軍を補佐し、幕府の政治を行う役職"],
["将軍を補佐し、幕府の政治を行う役職","1221年の後鳥羽上皇との戦いは？","承久の乱"],
["将軍を補佐し、幕府の政治を行う役職","承久の乱後、京都に置かれた機関は？","六波羅探題"],
["将軍を補佐し、幕府の政治を行う役職","1232年の武士の法典は？","御成敗式目"],
["社会","米と麦などを年2回作る農法は？","同じ土地で1年に2種類の作物を作る農法"],
["社会","鎌倉時代に広く流通した中国貨幣は？","中国から輸入された銅銭"],
["社会","高利貸し業者は？","高利貸しを行った金融業者"],
["元寇","1274年の元の侵攻は？","文永の役"],
["元寇","1281年の元の侵攻は？","弘安の役"],
["元寇","博多湾岸に築いた防御施設は？","博多湾岸に築いた元軍への防御施設"],
["元寇","元寇後の九州の警備役は？","元寇後、九州沿岸を警備する役目"],
["鎌倉後期","1285年の事件は？","霜月騒動"],
["鎌倉後期","1293年に九州に置かれた機関は？","鎮西探題"],
["鎌倉後期","1297年の御家人救済令は？","御家人の借金を帳消しにした法令"],
["新仏教","浄土宗の人物は？","法然"],
["新仏教","浄土真宗の人物は？","親鸞"],
["新仏教","時宗の人物は？","一遍"],
["新仏教","日蓮宗の人物は？","日蓮"],
["新仏教","臨済宗を広めた人物は？","栄西"],
["新仏教","曹洞宗を広めた人物は？","道元"],
["文化","東大寺再建に尽力した人物は？","重源"],
["文化","金剛力士像で有名な仏師は？","運慶・快慶"],
["幕府滅亡","1331年の後醍醐天皇の倒幕事件は？","元弘の変"],
["幕府滅亡","1333年に鎌倉を攻めた武将は？","新田義貞"],
["幕府滅亡","1333年に六波羅探題を攻めた武将は？","足利尊氏"],
["建武","1333年から天皇中心で行われた政治は？","建武の新政"],
["建武","武士への恩賞を担当した機関は？","恩賞方"],
["建武","所領訴訟を担当した機関は？","雑訴決断所"],
["建武","京都の警備を担当した機関は？","武者所"],
["南北朝","1335年の北条時行の乱は？","中先代の乱"],
["南北朝","後醍醐天皇が逃れた場所は？","吉野"],
["南北朝","1336年からの時代は？","南北朝時代"],
["室町","1338年に征夷大将軍になった人物は？","足利尊氏"]
];

let memory=JSON.parse(localStorage.getItem("nihonshiMemory")||"{}");
let filter="all", deck=[], index=0, marked=false;

function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function save(){localStorage.setItem("nihonshiMemory",JSON.stringify(memory))}
function updateStats(){
  document.getElementById("known").textContent=questions.filter((_,i)=>memory[i]===true).length;
  document.getElementById("weak").textContent=questions.filter((_,i)=>memory[i]===false).length;
}
function makeDeck(){
  let ids=questions.map((_,i)=>i);
  if(filter==="weak") ids=ids.filter(i=>memory[i]!==true);
  deck=shuffle(ids);
  index=0; document.getElementById("quiz").style.display=deck.length?"block":"none";
  document.getElementById("result").style.display=deck.length?"none":"block";
  if(deck.length) show();
}
function show(){
  marked=false;
  const i=deck[index],q=questions[i];
  document.getElementById("category").textContent=q[0];
  document.getElementById("counter").textContent=`${index+1} / ${deck.length}`;
  document.getElementById("remain").textContent=deck.length-index;
  document.getElementById("bar").style.width=(index/deck.length*100)+"%";
  document.getElementById("question").textContent=q[1];
  document.getElementById("answer").textContent=q[2];
  document.getElementById("answerBox").classList.remove("show");
  document.getElementById("tapBtn").style.display="block";
  document.getElementById("nextBtn").classList.remove("show");
}
function showAnswer(){document.getElementById("answerBox").classList.add("show");document.getElementById("tapBtn").style.display="none"}
function mark(known){
  if(marked)return; marked=true;
  memory[deck[index]]=known;save();updateStats();
  document.getElementById("nextBtn").classList.add("show");
}
function next(){if(index<deck.length-1){index++;show()}else finish()}
function finish(){
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("finalKnown").textContent=questions.filter((_,i)=>memory[i]===true).length+"問";
}
function setFilter(f){
  filter=f;
  document.getElementById("allBtn").className=f==="all"?"active":"";
  document.getElementById("weakBtn").className=f==="weak"?"active":"";
  makeDeck();
}
function shuffleNow(){makeDeck()}
function resetMemory(){
  if(confirm("覚えた・まだの記録を全部リセットしますか？")){memory={};save();updateStats();makeDeck()}
}
function restart(){makeDeck()}
updateStats();makeDeck();
</script>
</body>
</html>
